server.port=${PORT:3014}
# Each request runs on a virtual thread; a sleeping resolver frees the core for other requests
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
# No playground page, like graphiql: false (Node)
dgs.graphql.graphiql.enabled=false
# Cache parsed and validated queries, like the other servers. DGS documents this as on by default,
# but only creates the cache when the property is set
dgs.graphql.preparsedDocumentProvider.enabled=true
