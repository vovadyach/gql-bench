[project]
name = "gql-bench-python"
version = "1.0.0"
description = "FastAPI + Strawberry server for GraphQL Bench"
requires-python = ">=3.14"
# Exact versions are pinned in uv.lock
dependencies = [
    "fastapi",
    "httptools",
    "strawberry-graphql",
    "uvicorn",
    "uvloop",
]

[tool.uv]
package = false
